name: Daily Prep Sheet

on:
  schedule:
    # UTC 02:35 / 02:50 / 03:05 / 03:20 = JST 11:35 / 11:50 / 12:05 / 12:20 (昼休み・平日。GitHubのcronは高負荷時に遅延/スキップされるため多重トリガー)
    - cron: '35 2 * * 1-5'
    - cron: '50 2 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '20 3 * * 1-5'
    # UTC 06:35 / 06:50 / 07:05 = JST 15:35 / 15:50 / 16:05 (大引け後・トレール引上げ判定UI用)
    - cron: '35 6 * * 1-5'
    - cron: '50 6 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch: {}   # Actionsタブから手動実行するためのボタンが出る

permissions:
  contents: write   # daily_prep.jsonのcommit/pushに必要（リポジトリ既定はread-only）

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas pyarrow

      - name: Run daily prep sheet generator
        run: |
          set +e
          python -X utf8 daily_prep.py --output daily_prep.json
          code=$?
          set -e
          # 終了コード3 = 休場日(当日データなし)。既存JSONは保持されるため成功扱いにする
          if [ "$code" = "3" ]; then
            echo "休場日のためスキップ（既存の準備シートを保持）"
            exit 0
          fi
          exit $code

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_prep.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily prep sheet update $(date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push retry $i"
              sleep 5
            done
          fi
