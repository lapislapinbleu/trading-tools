<script>
const e = React.createElement;
const { useState, useMemo, useEffect } = React;

const TRAIL_MULT = 1.015;

// ---- localStorage 汎用ヘルパー（Safariプライベートモード等で例外になりうるため try/catch 保護） ----
function lsGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    // Safariプライベートモード等の書き込み失敗は無視（次回起動時は初期値に戻るだけ）
  }
}
function lsRemove(key) {
  try {
    window.localStorage.removeItem(key);
  } catch (err) {}
}

function usePersistentState(key, initial) {
  const [state, setState] = useState(() => lsGet(key, initial));
  useEffect(() => {
    lsSet(key, state);
  }, [key, state]);
  return [state, setState];
}

function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function genId() {
  return String(Date.now()) + "_" + Math.random().toString(36).slice(2, 7);
}

// A型3銘柄はすべてTOPIX500構成のため細かい呼値を使う（rulebook v1.5 §2.4・§3）
function tickSize(price) {
  if (price <= 1000) return 0.1;
  if (price <= 3000) return 0.5;
  if (price <= 10000) return 1;
  if (price <= 30000) return 5;
  return 10;
}
function roundDownTick(price, tick) {
  const steps = Math.floor(price / tick + 1e-6);
  return Math.round(steps * tick * 100) / 100;
}
function fmt(n) { return (n === null || n === undefined || Number.isNaN(n)) ? "―" : Math.round(n).toLocaleString("ja-JP"); }
function fmtPrice(n) { return (n === null || n === undefined || Number.isNaN(n)) ? "―" : n.toLocaleString("ja-JP", { maximumFractionDigits: 2 }); }

// ---- 監視リスト27銘柄辞書（rulebook v1.5 §2.1・2.4、2026-07-23判定） ----
const WATCH_ENTRIES = [
  { code: "5803", name: "フジクラ",     sector: "非鉄金属", cls: "green", rank: 1 },
  { code: "8306", name: "三菱UFJ",      sector: "銀行",     cls: "green", rank: 2 },
  { code: "8316", name: "三井住友FG",   sector: "銀行",     cls: "green", rank: 3 },
  { code: "5016", name: "JX金属",       sector: "非鉄金属", cls: "green", rank: 4 },
  { code: "5801", name: "古河電工",     sector: "非鉄金属", cls: "green", rank: 5 },
  { code: "8411", name: "みずほ",       sector: "銀行",     cls: "green", rank: 6 },
  { code: "8766", name: "東京海上",     sector: "保険",     cls: "green", rank: 7 },

  { code: "8630", name: "SOMPO",        sector: "保険",     cls: "green", rank: 16 },
  { code: "8309", name: "三井住友TR",   sector: "銀行",     cls: "green", rank: 17 },
  { code: "8795", name: "T&D",          sector: "保険",     cls: "green", rank: 18 },
  { code: "5101", name: "横浜ゴム",     sector: "ゴム",     cls: "green", rank: 19 },
  { code: "5711", name: "三菱マテ",     sector: "非鉄金属", cls: "green", rank: 20 },
  { code: "5714", name: "DOWA",         sector: "非鉄金属", cls: "yellow", rank: null },
  { code: "5110", name: "住友ゴム",     sector: "ゴム",     cls: "yellow", rank: null },

const WATCHLIST = WATCH_ENTRIES.reduce((acc, x) => { acc[x.code] = x; return acc; }, {});
const GREEN_ENTRIES = WATCH_ENTRIES.filter((x) => x.cls === "green");
const YELLOW_ENTRIES = WATCH_ENTRIES.filter((x) => x.cls === "yellow");
const FINANCIAL_SECTORS = ["銀行", "保険"];
const SECTOR_CHAR = { "非鉄金属": "非", "銀行": "銀", "保険": "保", "ゴム": "ゴ", "倉庫運輸": "倉" };
const NO_MARKET_CODES = ["9364", "9301", "9302"];

function normalizeCode(code) { return (code || "").trim(); }

function computeViolations(slots, heldPositions) {
  const held = heldPositions || [];
  const filled = slots
    .map((s, i) => ({ idx: i, code: normalizeCode(s.code) }))
    .filter((s) => s.code.length === 4);
  const violations = [];

  // 1. 重複（枠間）
  const countByCode = {};
  filled.forEach((s) => { countByCode[s.code] = (countByCode[s.code] || 0) + 1; });
  Object.keys(countByCode).forEach((code) => {
    if (countByCode[code] >= 2) {
      const info = WATCHLIST[code];
      violations.push({
        level: "error",
        text: `重複: ${code}${info ? "（" + info.name + "）" : ""}が${countByCode[code]}枠で重複しています。同一銘柄の重複保有は不可`,
      });
    }
  });

  // 1b. 保有中建玉との重複
  const heldCodes = new Set(held.map((p) => normalizeCode(p.code)));
  filled.forEach((s) => {
    if (heldCodes.has(s.code)) {
      const info = WATCHLIST[s.code];
      violations.push({
        level: "error",
        text: `枠${s.idx + 1}: ${s.code}${info ? "（" + info.name + "）" : ""}は保有中の建玉と重複`,
      });
    }
  });

  // 2. セクター上限（4枠以上で違反＝最大3銘柄。保有中を合算）
  const sectorCount = {};
  const sectorHeldCount = {};
  held.forEach((p) => {
    if (p.sector) {
      sectorCount[p.sector] = (sectorCount[p.sector] || 0) + 1;
      sectorHeldCount[p.sector] = (sectorHeldCount[p.sector] || 0) + 1;
    }
  });
  filled.forEach((s) => {
    const info = WATCHLIST[s.code];
    if (info) sectorCount[info.sector] = (sectorCount[info.sector] || 0) + 1;
  });
  Object.keys(sectorCount).forEach((sector) => {
    if (sectorCount[sector] >= 4) {
      const heldN = sectorHeldCount[sector] || 0;
      violations.push({
        level: "error",
        text: `セクター上限超過: 「${sector}」が${sectorCount[sector]}銘柄です${heldN > 0 ? `（保有中${heldN}件を含む）` : ""}。同一セクターは最大3銘柄（§2.2②）`,
      });
    }
  });

  // 3. 金融クラスタ上限（5枠以上で違反＝最大4銘柄。保有中を合算）
  const finHeldCount = held.filter((p) => p.sector && FINANCIAL_SECTORS.includes(p.sector)).length;
  const finFilledCount = filled.filter((s) => {
    const info = WATCHLIST[s.code];
    return info && FINANCIAL_SECTORS.includes(info.sector);
  }).length;
  const finCount = finHeldCount + finFilledCount;
  if (finCount >= 5) {
    violations.push({
      level: "error",
      text: `金融クラスタ上限超過: 銀行＋保険 合計${finCount}銘柄です${finHeldCount > 0 ? `（保有中${finHeldCount}件を含む）` : ""}。金融（銀行＋保険）は最大4銘柄（§2.2③）`,
    });
  }

  // 4. 非監視銘柄
  filled.forEach((s) => {
    if (!WATCHLIST[s.code]) {
      violations.push({
        level: "error",
        text: `枠${s.idx + 1}: コード${s.code}は監視リスト27銘柄外。フェニックス発注対象外`,
      });
    }
  });

  // 5. 黄区分（注意）
  filled.forEach((s) => {
    const info = WATCHLIST[s.code];
    if (info && info.cls === "yellow") {
      violations.push({
        level: "warn",
        text: `枠${s.idx + 1}: ${info.name}（${s.code}）は黄区分。緑で5枠が埋まらない時のみ使用`,
      });
    }
  });

  // 6. 成行禁止
  filled.forEach((s) => {
    if (NO_MARKET_CODES.includes(s.code)) {
      const info = WATCHLIST[s.code];
      violations.push({
        level: "error",
        text: `枠${s.idx + 1}: ${info.name}（${s.code}）は成行禁止（指値のみ・旧赤運用継続）`,
      });
    }
  });

  return violations;
}

function computePhoenixSlot(entry, morningLow) {
  const RISK_CAP = 77000, NOTIONAL_CAP = 1027000, SL_BUFFER = 0.003, TP_MULT = 1.05, TRAIL_MULT = 1.015;
  const en = parseFloat(entry), ml = parseFloat(morningLow);
  if (!en || !ml || en <= 0 || ml <= 0) return null;
  const sl = ml * (1 - SL_BUFFER);
  const riskPerShare = en - sl;
  if (riskPerShare <= 0) return { error: "前引け値が前場安値以下です。入力を確認してください。" };
  const tp = en * TP_MULT, trailTrigger = en * TRAIL_MULT;
  const sharesByRisk = Math.floor(RISK_CAP / riskPerShare / 100) * 100;
  const sharesByNotional = Math.floor(NOTIONAL_CAP / en / 100) * 100;
  const finalShares = Math.min(sharesByRisk, sharesByNotional);
  if (finalShares <= 0) return { error: "建玉代金上限に対して株価が高すぎます（100株単位で購入不可）。見送り推奨。" };
  const binding = sharesByRisk <= sharesByNotional ? "risk" : "notional";
  return {
    sl, tp, trailTrigger, riskPerShare, sharesByRisk, sharesByNotional, finalShares, binding,
    positionValue: finalShares * en, maxLoss: finalShares * riskPerShare, maxGain: finalShares * (tp - en),
  };
}

function PhoenixCalc({ slots, setSlots, onTranscribe, heldPositions }) {
  const updateSlot = (idx, field, value) => {
    setSlots((prev) => prev.map((s, i) => (i === idx ? { ...s, [field]: value } : s)));
  };
  const results = useMemo(() => slots.map((s) => computePhoenixSlot(s.entry, s.morningLow)), [slots]);
  const violations = useMemo(() => computeViolations(slots, heldPositions), [slots, heldPositions]);
  const totalMaxLoss = useMemo(
    () => results.reduce((sum, r) => sum + ((r && !r.error) ? r.maxLoss : 0), 0),
    [results]
  );
  const overCap = totalMaxLoss > 154000;

  return e("div", { className: "space-y-4" },
    e(WatchlistPanel),
    e(ViolationPanel, { violations }),
    e("div", { className: "space-y-3" },
      slots.map((s, idx) => e(PhoenixSlotCard, { key: idx, idx, slot: s, result: results[idx], onChange: updateSlot, onTranscribe }))
    ),
    e(TotalLossCard, { totalMaxLoss, overCap })
  );
}

function AtypeCalc({ c2open, setC2open, c2high, setC2high }) {
  const RISK_CAP = 44000, NOTIONAL_CAP = 1000000;

  const r = useMemo(() => {
    const entry = parseFloat(c2open), spikeHigh = parseFloat(c2high);
    if (!entry || !spikeHigh || entry <= 0 || spikeHigh <= 0) return null;
    if (spikeHigh <= entry) return { error: "2本目高値が2本目始値以下です。入力を確認してください。" };
    const tick = tickSize(entry);
    const sl = Math.round((spikeHigh + tick) * 100) / 100;
    const riskPerShare = sl - entry;
    const tp = roundDownTick(entry * 0.97, tick);
    const sharesByRisk = Math.floor(RISK_CAP / riskPerShare / 100) * 100;
    const sharesByNotional = Math.floor(NOTIONAL_CAP / entry / 100) * 100;
    const finalShares = Math.min(sharesByRisk, sharesByNotional);
    if (finalShares <= 0) return { error: "建玉代金上限に対して株価が高すぎます（100株単位で売建不可）。見送り推奨。" };
    const binding = sharesByRisk <= sharesByNotional ? "risk" : "notional";
    return {
      tick, sl, tp, riskPerShare, sharesByRisk, sharesByNotional, finalShares, binding,
      positionValue: finalShares * entry, maxLoss: finalShares * riskPerShare, maxGain: finalShares * (entry - tp),
    };
  }, [c2open, c2high]);

  return e("div", { className: "space-y-5" },
    e("div", { className: "flex items-start gap-2 rounded-xl bg-slate-900/60 border border-slate-800 px-3.5 py-3 text-[12px] text-slate-400" },
      e(Info, { size: 14, className: "shrink-0 mt-0.5" }),

    ),
    e("div", { className: "grid grid-cols-1 gap-3" },
      e(NumberField, { id: "atype_c2open", label: "2本目の始値（＝エントリー価格）", value: c2open, onChange: setC2open, placeholder: "例: 1500", suffix: "円" }),
      e(NumberField, { id: "atype_c2high", label: "2本目の高値（スパイク高値）", value: c2high, onChange: setC2high, placeholder: "例: 1545", suffix: "円" })
    ),
    r && r.error && e("div", { className: "flex items-start gap-2 rounded-xl bg-red-500/10 border border-red-500/25 px-3.5 py-3 text-[13px] text-red-300" },
      e(AlertTriangle, { size: 16, className: "shrink-0 mt-0.5" }),
      e("span", null, r.error)
    ),
    r && !r.error && e(React.Fragment, null,

        e("div", { className: "text-[12px] text-slate-400 tracking-wide mb-1" }, "推奨株数（売建）"),
        e("div", { className: "text-[44px] leading-none font-mono font-bold tabular-nums text-emerald-400" },
          fmt(r.finalShares), e("span", { className: "text-[18px] text-slate-400 ml-1" }, "株")),
        e("div", { className: "mt-2 text-[13px] text-slate-400 font-mono tabular-nums" }, `建玉代金 ¥${fmt(r.positionValue)}`)
      ),
      e(ConstraintBadge, { binding: r.binding, sharesByRisk: r.sharesByRisk, sharesByNotional: r.sharesByNotional }),
      e("div", { className: "rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-1" },
        e(ResultRow, { label: "呼値（細かい呼値・TOPIX500）", value: `¥${r.tick}`, tone: "muted" }),
        e(ResultRow, { label: "SL（スパイク高値+1呼値）", value: `¥${fmtPrice(r.sl)}` }),

        e(ResultRow, { label: "1株あたりリスク", value: `¥${fmtPrice(r.riskPerShare)}`, tone: "muted" })
      ),

        e(ResultRow, { label: "想定利益（TP到達時）", value: `+¥${fmt(r.maxGain)}`, tone: "good" })

function effectivePositionMaxLoss(p) {
  const hasSl = Number.isFinite(p.slPrice);
  if (!hasSl && !p.trailArmed) return 0;
  const eff = p.trailArmed ? Math.max(hasSl ? p.slPrice : p.entryPrice, p.entryPrice) : p.slPrice;
  return Math.max(0, (p.entryPrice - eff) * p.qty);
}

function todayRealizedPnl(closed) {
  const today = todayStr();
  return closed.filter((c) => c.closeDate === today).reduce((sum, c) => sum + c.pnl, 0);
}

  const todayLoss = Math.max(0, -todayPnlSum);

function computeRegistrationWarnings(form, positions, closed) {
  const code = normalizeCode(form.code);
  const qty = parseFloat(form.qty);
  const entryPrice = parseFloat(form.entryPrice);
  const slPrice = parseFloat(form.slPrice);
  if (!(code.length === 4 && qty > 0 && entryPrice > 0)) return [];

  const warnings = [];
  const info = WATCHLIST[code];
  const positionValue = qty * entryPrice;

  if (positionValue > NOTIONAL_CAP) {
    warnings.push(`建玉代金 ¥${fmt(positionValue)} が1銘柄上限 ¥${fmt(NOTIONAL_CAP)} を超えています`);
  }
  if (Number.isFinite(slPrice) && slPrice < entryPrice) {
    const risk = (entryPrice - slPrice) * qty;
    if (risk > RISK_CAP) {
      warnings.push(`1建玉のリスク ¥${fmt(risk)} が上限 ¥${fmt(RISK_CAP)} を超えています`);
    }
  }
  const heldCodes = positions.map((p) => normalizeCode(p.code));
  if (heldCodes.includes(code)) {
    warnings.push(`重複: ${code}${info ? "（" + info.name + "）" : ""}は保有中の建玉と重複しています`);
  }
  const postCount = positions.length + 1;
  if (postCount > MAX_POSITIONS) {
    warnings.push(`登録後の保有数が${postCount}件になり、同時保有上限${MAX_POSITIONS}件を超えます`);
  }

  const existingMaxLossSum = positions.reduce((sum, p) => sum + effectivePositionMaxLoss(p), 0);
  const newMaxLoss = Number.isFinite(slPrice) && slPrice < entryPrice ? (entryPrice - slPrice) * qty : 0;
  const todayLoss = Math.max(0, -todayRealizedPnl(closed));
  const projectedTotal = existingMaxLossSum + newMaxLoss + todayLoss;
  if (projectedTotal > DAILY_LOSS_CAP) {
    warnings.push(`登録後の想定最大損失合計＋当日確定損失 ¥${fmt(projectedTotal)} が日次上限 ¥${fmt(DAILY_LOSS_CAP)} を超えます`);
  }

  if (info) {
    const sectorAfter = positions.filter((p) => p.sector === info.sector).length + 1;
    if (sectorAfter >= 4) {
      warnings.push(`登録後「${info.sector}」セクターが${sectorAfter}銘柄になります（同一セクター上限3）`);
    }
    if (FINANCIAL_SECTORS.includes(info.sector)) {
      const finAfter = positions.filter((p) => p.sector && FINANCIAL_SECTORS.includes(p.sector)).length + 1;
      if (finAfter >= 5) {
        warnings.push(`登録後 金融（銀行＋保険）が${finAfter}銘柄になります（金融クラスタ上限4）`);
      }
    }
    if (info.cls === "yellow") {
      warnings.push(`${info.name}（${code}）は黄区分。緑で5枠が埋まらない時のみ使用`);
    }
    if (NO_MARKET_CODES.includes(code)) {
      warnings.push(`${info.name}（${code}）は成行禁止（指値のみ・旧赤運用継続）`);
    }
  } else {
    warnings.push(`コード${code}は監視リスト27銘柄外。フェニックス発注対象外`);
  }

  return warnings;
}

function RegistrationWarnings({ warnings }) {
  if (!warnings || warnings.length === 0) return null;
  return e("div", { className: "space-y-1.5" },
    warnings.map((w, i) => e("div", {
      key: i,
      className: "flex items-start gap-2 rounded-xl px-3.5 py-2.5 text-[12.5px] border bg-amber-500/10 border-amber-500/25 text-amber-300",
    },
      e(AlertTriangle, { size: 14, className: "shrink-0 mt-0.5" }),
      e("span", null, w)
    ))
  );
}

function BackupPanel({ positions, setPositions, closed, setClosed }) {
  const [open, setOpen] = useState(false);
  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState("");

  const doExport = () => {
    const sizing = lsGet("sizing_v1", DEFAULT_SIZING);
    const data = {
      exportedAt: new Date().toISOString(),
      sizing_v1: sizing,
      positions_v1: positions,
      closed_v1: closed,
    };
    setExportText(JSON.stringify(data, null, 2));
  };

  const doImport = () => {
    setImportError("");
    let parsed;
    try {
      parsed = JSON.parse(importText);
    } catch (err) {
      setImportError("JSONの解析に失敗しました。貼り付け内容を確認してください。");
      return;
    }
    const isValidArr = (arr) => Array.isArray(arr) && arr.every((x) =>
      x && typeof x === "object" && "code" in x && "qty" in x && "entryPrice" in x);
    const posOk = isValidArr(parsed.positions_v1);
    const closedOk = isValidArr(parsed.closed_v1);
    if (!posOk || !closedOk) {
      setImportError("形式が不正です。positions_v1 / closed_v1 が配列であり、各要素に code・qty・entryPrice を含む必要があります。");
      return;
    }
    if (!window.confirm("現在のデータを上書きします。よろしいですか？")) return;
    const nextSizing = parsed.sizing_v1 || DEFAULT_SIZING;
    lsSet("sizing_v1", nextSizing);
    lsSet("positions_v1", parsed.positions_v1);
    lsSet("closed_v1", parsed.closed_v1);
    setPositions(parsed.positions_v1);
    setClosed(parsed.closed_v1);
    setImportText("");
    setImportError("");
  };

  return e("div", { className: "rounded-xl bg-slate-900/60 border border-slate-800" },
    e("button", {
      onClick: () => setOpen((o) => !o),
      className: "w-full flex items-center justify-between px-3.5 py-2.5 text-[12.5px] font-medium text-slate-300",
    }, e("span", null, `バックアップ ${open ? "▲" : "▼"}`)),
    open && e("div", { className: "px-3.5 pb-3.5 space-y-3" },
      e("div", { className: "space-y-1.5" },
        e("div", { className: "text-[11.5px] text-slate-500" }, "エクスポート（サイジング入力・建玉・決済履歴を含む）"),
        e("button", {
          onClick: doExport,
          className: "w-full rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-[12.5px] font-semibold py-2.5",
        }, "エクスポート"),
        exportText && e("textarea", {
          readOnly: true,
          value: exportText,
          onClick: (ev) => ev.target.select(),
          rows: 6,
          className: "w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-[11px] font-mono text-slate-300",
        })
      ),
      e("div", { className: "space-y-1.5" },
        e("div", { className: "text-[11.5px] text-slate-500" }, "インポート（現在のデータを上書き）"),
        e("textarea", {
          value: importText,
          onChange: (ev) => setImportText(ev.target.value),
          placeholder: "エクスポートしたJSONをここに貼り付け",
          rows: 6,
          className: "w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-[11px] font-mono text-slate-300 placeholder:text-slate-600",
        }),
        importError && e("div", { className: "text-[12px] text-red-400" }, importError),
        e("button", {
          onClick: doImport,
          className: "w-full rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[12.5px] font-semibold py-2.5",
        }, "インポート")
      )
    )
  );
}

function PositionsSection({ positions, setPositions, prefill }) {
  const [closed, setClosed] = usePersistentState("closed_v1", []);
  const [formOpen, setFormOpen] = useState(false);
  const [form, setForm] = useState({ ...DEFAULT_POSITION_FORM, entryDate: todayStr() });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [settlingId, setSettlingId] = useState(null);
  const [settlePrice, setSettlePrice] = useState("");
  const [closedOpen, setClosedOpen] = useState(false);

  useEffect(() => {
    if (!prefill) return;
    setFormOpen(true);
    setForm({
      code: normalizeCode(prefill.code || ""),
      qty: prefill.qty != null ? String(prefill.qty) : "",
      entryPrice: prefill.entryPrice != null ? String(prefill.entryPrice) : "",
      slPrice: prefill.slPrice != null ? String(prefill.slPrice) : "",
      tpPrice: prefill.tpPrice != null ? String(prefill.tpPrice) : "",
      entryDate: prefill.entryDate || todayStr(),
      note: "",
    });
  }, [prefill]);

  const updateForm = (field, value) => setForm((prev) => ({ ...prev, [field]: value }));

  const canRegister = normalizeCode(form.code).length === 4 &&
    parseFloat(form.qty) > 0 && parseFloat(form.entryPrice) > 0;

  const registerPosition = () => {
    if (!canRegister) return;
    const code = normalizeCode(form.code);
    const info = WATCHLIST[code];
    const qty = parseFloat(form.qty);
    const entryPrice = parseFloat(form.entryPrice);
    const slPrice = parseFloat(form.slPrice);
    const tpPrice = parseFloat(form.tpPrice);
    const newPos = {
      id: genId(), code, name: info ? info.name : code, sector: info ? info.sector : null,
      entryDate: form.entryDate || todayStr(), qty, entryPrice,
      slPrice: Number.isFinite(slPrice) ? slPrice : null,
      tpPrice: Number.isFinite(tpPrice) ? tpPrice : null,
      trailArmed: false, note: (form.note || "").trim(),
    };
    setPositions((prev) => [...prev, newPos]);
    setForm({ ...DEFAULT_POSITION_FORM, entryDate: todayStr() });
    setFormOpen(false);
  };

  const toggleTrail = (id) => {
    setPositions((prev) => prev.map((p) => (p.id === id ? { ...p, trailArmed: !p.trailArmed } : p)));
  };

  const startEdit = (pos) => {
    setEditingId(pos.id);
    setEditForm({
      qty: String(pos.qty), entryPrice: String(pos.entryPrice),
      slPrice: Number.isFinite(pos.slPrice) ? String(pos.slPrice) : "",
      tpPrice: Number.isFinite(pos.tpPrice) ? String(pos.tpPrice) : "",
      entryDate: pos.entryDate, note: pos.note || "",
    });
  };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); };
  const saveEdit = () => {
    setPositions((prev) => prev.map((p) => {
      if (p.id !== editingId) return p;
      const qty = parseFloat(editForm.qty), entryPrice = parseFloat(editForm.entryPrice);
      const slPrice = parseFloat(editForm.slPrice), tpPrice = parseFloat(editForm.tpPrice);
      return {
        ...p,
        qty: qty > 0 ? qty : p.qty,
        entryPrice: entryPrice > 0 ? entryPrice : p.entryPrice,
        slPrice: Number.isFinite(slPrice) ? slPrice : null,
        tpPrice: Number.isFinite(tpPrice) ? tpPrice : null,
        entryDate: editForm.entryDate || p.entryDate,
        note: (editForm.note || "").trim(),
      };
    }));
    setEditingId(null);
    setEditForm(null);
  };

  const startSettle = (pos) => { setSettlingId(pos.id); setSettlePrice(""); };
  const cancelSettle = () => { setSettlingId(null); setSettlePrice(""); };
  const confirmSettle = () => {
    const closePrice = parseFloat(settlePrice);
    if (!(closePrice > 0)) return;
    const pos = positions.find((p) => p.id === settlingId);
    if (!pos) return;
    const pnl = (closePrice - pos.entryPrice) * pos.qty;
    const record = {
      id: genId(), code: pos.code, name: pos.name, sector: pos.sector,
      entryDate: pos.entryDate, closeDate: todayStr(), qty: pos.qty,
      entryPrice: pos.entryPrice, closePrice, pnl, note: pos.note || "",
    };
    setClosed((prev) => [...prev, record]);
    setPositions((prev) => prev.filter((p) => p.id !== pos.id));
    setSettlingId(null);
    setSettlePrice("");
  };

  const warnings = useMemo(() => computeRegistrationWarnings(form, positions, closed), [form, positions, closed]);

  return e("div", { className: "space-y-4" },
    e("div", { className: "rounded-xl bg-slate-900/60 border border-slate-800" },
      e("button", {
        onClick: () => setFormOpen((o) => !o),
        className: "w-full flex items-center justify-between px-3.5 py-3 text-[13px] font-medium text-slate-300",
      }, e("span", null, `建玉を登録 ${formOpen ? "▲" : "▼"}`)),
      formOpen && e("div", { className: "px-3.5 pb-3.5 space-y-2.5" },
        e(CodeField, { value: form.code, onChange: (v) => updateForm("code", v) }),
        e(StockBadge, { code: form.code }),
        e(PositionEditFields, { form, onChange: updateForm }),
        e(RegistrationWarnings, { warnings }),
        e("button", {
          onClick: registerPosition,
          disabled: !canRegister,
          className: `w-full rounded-lg text-[13.5px] font-semibold py-3 ${canRegister ? "bg-emerald-500/90 text-slate-950" : "bg-slate-800 text-slate-600"}`,
        }, "登録")
      )
    ),
    e(SummaryPanel, { positions, closed }),
    positions.length === 0
      ? e("div", { className: "rounded-xl bg-slate-900/40 border border-slate-800 px-3.5 py-6 text-center text-[13px] text-slate-500" }, "建玉はまだありません")
      : e("div", { className: "space-y-3" },
          positions.map((pos) => e(PositionCard, {
            key: pos.id, pos,
            isEditing: editingId === pos.id, editForm,
            onEditField: (field, v) => setEditForm((prev) => ({ ...prev, [field]: v })),
            onStartEdit: () => startEdit(pos),
            onCancelEdit: cancelEdit,
            onSaveEdit: saveEdit,
            onToggleTrail: () => toggleTrail(pos.id),
            isSettling: settlingId === pos.id,
            settlePrice,
            onSettlePriceChange: setSettlePrice,
            onStartSettle: () => startSettle(pos),
            onCancelSettle: cancelSettle,
            onConfirmSettle: confirmSettle,
          }))
        ),
    e(ClosedHistoryPanel, { closed, open: closedOpen, onToggle: () => setClosedOpen((o) => !o) }),
    e(BackupPanel, { positions, setPositions, closed, setClosed })
  );
}

const DEFAULT_SIZING = {
  slots: [0, 1, 2, 3, 4].map(() => ({ code: "", entry: "", morningLow: "" })),
  c2open: "",
  c2high: "",
};

function SizingSection({ onTranscribe, heldPositions }) {
  const [tab, setTab] = useState("phoenix");
  const [sizing, setSizing] = usePersistentState("sizing_v1", DEFAULT_SIZING);

  const setSlots = (updater) => {
    setSizing((prev) => ({
      ...prev,
      slots: typeof updater === "function" ? updater(prev.slots) : updater,
    }));
  };
  const setC2open = (v) => setSizing((prev) => ({ ...prev, c2open: v }));
  const setC2high = (v) => setSizing((prev) => ({ ...prev, c2high: v }));

  const clearSizing = () => {
    if (!window.confirm("サイジング入力をすべてクリアしますか？")) return;
    setSizing(DEFAULT_SIZING);
  };

  return e("div", null,
    e("div", { className: "grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-900 border border-slate-800 mb-5" },
      e("button", {
        onClick: () => setTab("phoenix"),
        className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${tab === "phoenix" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
      }, e(TrendingUp, { size: 15 }), "フェニックス"),
      e("button", {
        onClick: () => setTab("atype"),
        className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${tab === "atype" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
      }, e(TrendingDown, { size: 15 }), "A型")
    ),
    tab === "phoenix"
      ? e(PhoenixCalc, { slots: sizing.slots, setSlots, onTranscribe, heldPositions })
      : e(AtypeCalc, { c2open: sizing.c2open, setC2open, c2high: sizing.c2high, setC2high }),
    e("div", { className: "mt-6 flex items-start gap-2 rounded-xl bg-slate-900/50 border border-slate-800 px-3.5 py-3 text-[12px] text-slate-500" },
      e(Info, { size: 14, className: "shrink-0 mt-0.5" }),
      e("span", null, "フェニックス同時保有最大5枠（セクター上限3・金融上限4）・1日損失上限15.4万円／A型1日1件・上限8.8万円／合算24.2万円で当日全システム停止。")
    ),
    e("button", {
      onClick: clearSizing,
      className: "mt-4 w-full rounded-xl border border-slate-800 bg-slate-900/60 py-2.5 text-[12.5px] font-medium text-slate-400 hover:text-red-300 hover:border-red-500/30 transition-colors",
    }, "入力をクリア")
  );
}

function App() {
  const [topTab, setTopTab] = useState("sizing");
  const [positions, setPositions] = usePersistentState("positions_v1", []);
  const [prefill, setPrefill] = useState(null);

  const handleTranscribe = (payload) => {
    setPrefill({ ...payload, _key: genId() });
    setTopTab("positions");
  };

  return e("div", {
    className: "min-h-screen bg-slate-950 text-slate-100 flex justify-center",
    style: { paddingTop: "env(safe-area-inset-top)", paddingBottom: "env(safe-area-inset-bottom)" },
  },
    e("div", { className: "w-full max-w-md px-4 pt-6 pb-10" },
      e("div", { className: "mb-5" },
        e("h1", { className: "text-[20px] font-bold tracking-tight text-slate-50" }, "ポジションサイジング"),
        e("p", { className: "text-[12px] text-slate-500 mt-0.5" }, "リスク上限 ÷ SL距離 と 建玉代金上限 の小さい方を採用")
      ),
      e("div", { className: "grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-900 border border-slate-800 mb-5" },
        e("button", {
          onClick: () => setTopTab("sizing"),
          className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${topTab === "sizing" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
        }, "サイジング"),
        e("button", {
          onClick: () => setTopTab("positions"),
          className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${topTab === "positions" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
        }, "建玉管理")
      ),
      topTab === "sizing"
        ? e(SizingSection, { onTranscribe: handleTranscribe, heldPositions: positions })
        : e(PositionsSection, { positions, setPositions, prefill })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
