// ---- localStorage 汎用ヘルパー（Safariプライベートモード等で例外になりうるため try/catch 保護） ----
function lsGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    // Safariプライベートモード等の書き込み失敗は無視（次回起動時は初期値に戻るだけ）
  }
}
function lsRemove(key) {
  try {
    window.localStorage.removeItem(key);
  } catch (err) {}
}

function usePersistentState(key, initial) {
  const [state, setState] = useState(() => lsGet(key, initial));
  useEffect(() => {
    lsSet(key, state);
  }, [key, state]);
  return [state, setState];
}

function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");

}

function genId() {

// "YYYY-MM-DD" をローカル日付として解釈（new Date(str)のタイムゾーン依存を回避）
function parseISODate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function isoOfDate(d) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function isBusinessDay(d) {
  const day = d.getDay();
  if (day === 0 || day === 6) return false;
  if (JP_HOLIDAY_SET.has(isoOfDate(d))) return false;
  return true;
}
// dateStr（起点日、休日でも可）から n 営業日後の日付を "YYYY-MM-DD" で返す
function addBusinessDays(dateStr, n) {
  let d = parseISODate(dateStr);
  let count = 0;
  while (count < n) {
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    if (isBusinessDay(d)) count++;
  }
  return isoOfDate(d);
}
// "YYYY-MM-DD" → "M/D(曜)" 表示
function fmtDateWithWeekday(dateStr) {
  if (!dateStr) return "―";
  const d = parseISODate(dateStr);
  return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAY_JP[d.getDay()]})`;
}
// フェニックス保有期限（エントリー+4営業日＝5営業日目）と寄成返済日（期限日の翌営業日＝+5営業日）
function phoenixDueDate(entryDate) {
  return addBusinessDays(entryDate, 4);
}
function phoenixMarketSellDate(entryDate) {

// ---- 監視リスト27銘柄辞書（rulebook v1.5 §2.1・2.4、2026-07-23判定） ----

const WATCHLIST = WATCH_ENTRIES.reduce((acc, x) => { acc[x.code] = x; return acc; }, {});

const FINANCIAL_SECTORS = ["銀行", "保険"];
const SECTOR_CHAR = { "非鉄金属": "非", "銀行": "銀", "保険": "保", "ゴム": "ゴ", "倉庫運輸": "倉" };
const NO_MARKET_CODES = ["9364", "9301", "9302"];

// ---- ATR自動推定の定数（rulebook v1.9・SL式のATR項）----
// 生成元: jq/fullmarket/audit_atr_approximation.py の検証（2026-08-01実行・
// jq/fullmarket/results/atr_approximation_study.md）。データ期間: bars_5m
// 2024-07〜2026-07(監視27銘柄・全営業日)。判定: 指標②(SL価格ズレ>株価0.2%の日割合)
// が最小だった (d)ハイブリッド max(p_code×前引け値, c_global×前場レンジ) を採用。
// 四半期再選抜時にこの定数表とc_global・audit_atr_approximation.pyの再実行結果を更新すること。
//
// p_code: 銘柄別定数(直近60営業日のatr_confirm/closeの中央値・ローリング、末尾値)。
// 古河電工(5801)・住友電工(5802)は2026-06-29に未調整分割(1:10/1:4)があるため、
// ローリング窓は分割前後で分断して算出(比率自体はスケール不変なので分割後もそのまま使える)。
const ATR_PCODE = {
  "5016": 0.00590, "5101": 0.00298, "5105": 0.00225, "5108": 0.00150, "5110": 0.00225,
  "5711": 0.00325, "5713": 0.00431, "5714": 0.00322, "5801": 0.00631, "5802": 0.00506,
  "5803": 0.00631, "7181": 0.00235, "7182": 0.00263, "8306": 0.00221, "8308": 0.00296,
  "8309": 0.00208, "8316": 0.00226, "8411": 0.00279, "8630": 0.00208, "8725": 0.00184,
  "8729": 0.00186, "8750": 0.00228, "8766": 0.00215, "8795": 0.00241, "9301": 0.00179,
  "9302": 0.00189, "9364": 0.00154,
};
// c_global: 前場レンジ比例のグローバル1定数(全銘柄・全日のatr_confirm/前場レンジの中央値)。
const ATR_C_GLOBAL = 0.109023;

function normalizeCode(code) { return (code || "").trim(); }

// ATR自動推定(未入力時のみ使用)。(a)p_code×前引け値 と (b)c_global×前場レンジ の
// 大きい方を採用(仕様: 急変日はレンジ項が持ち上げるハイブリッド式)。
// 前場高値が未入力、または銘柄が監視リスト外でp_code不明なら、算出できる方だけを使う。
// どちらも算出不能ならnullを返す(呼び出し側で0.3%下限のみにフォールバック)。
function estimateAtrYen(code, en, ml, mh) {
  const norm = normalizeCode(code);
  const p = ATR_PCODE[norm];
  const aEst = (p !== undefined && en > 0) ? p * en : null;
  const range = (mh > 0 && ml > 0 && mh > ml) ? mh - ml : null;
  const bEst = range !== null ? ATR_C_GLOBAL * range : null;
  if (aEst === null && bEst === null) return null;
  if (bEst === null) return { value: aEst, label: `推定ATR: 銘柄別係数(p=${p.toFixed(5)})×前引け値` };
  if (aEst === null) return { value: bEst, label: `推定ATR: 前場レンジ×${ATR_C_GLOBAL.toFixed(3)}` };
  return aEst >= bEst
    ? { value: aEst, label: `推定ATR: 銘柄別係数(p=${p.toFixed(5)})×前引け値` }
    : { value: bEst, label: `推定ATR: 前場レンジ×${ATR_C_GLOBAL.toFixed(3)}` };
}

// 建玉オブジェクトの共通生成（フェニックス直接登録・建玉管理タブの手動登録の両方から使用）
function buildPosition(fields) {
  const code = normalizeCode(fields.code);
  const info = WATCHLIST[code];
  const numOrNull = (v) => (Number.isFinite(v) ? v : null);
  return {
    id: genId(), code, name: info ? info.name : code, sector: info ? info.sector : null,
    entryDate: fields.entryDate || todayStr(),
    qty: fields.qty, entryPrice: fields.entryPrice,
    slPrice: numOrNull(fields.slPrice), tpPrice: numOrNull(fields.tpPrice),
    trailArmed: false, note: (fields.note || "").trim(),
    refPrice: numOrNull(fields.refPrice), fillPrice: numOrNull(fields.fillPrice),
    morningClose: numOrNull(fields.morningClose), morningLow: numOrNull(fields.morningLow),
  };
}

function computeViolations(slots, heldPositions) {
  const held = heldPositions || [];
  const filled = slots
    .map((s, i) => ({ idx: i, code: normalizeCode(s.code) }))
    .filter((s) => s.code.length === 4);
  const violations = [];

  // 1. 重複（枠間）
  const countByCode = {};
  filled.forEach((s) => { countByCode[s.code] = (countByCode[s.code] || 0) + 1; });
  Object.keys(countByCode).forEach((code) => {
    if (countByCode[code] >= 2) {
      const info = WATCHLIST[code];
      violations.push({
        level: "error",
        text: `重複: ${code}${info ? "（" + info.name + "）" : ""}が${countByCode[code]}枠で重複しています。同一銘柄の重複保有は不可`,
      });
    }
  });

  // 1b. 保有中建玉との重複
  const heldCodes = new Set(held.map((p) => normalizeCode(p.code)));
  filled.forEach((s) => {
    if (heldCodes.has(s.code)) {
      const info = WATCHLIST[s.code];
      violations.push({
        level: "error",
        text: `枠${s.idx + 1}: ${s.code}${info ? "（" + info.name + "）" : ""}は保有中の建玉と重複`,
      });
    }
  });

  // 2. セクター上限（4枠以上で違反＝最大3銘柄。保有中を合算）
  const sectorCount = {};
  const sectorHeldCount = {};
  held.forEach((p) => {
    if (p.sector) {
      sectorCount[p.sector] = (sectorCount[p.sector] || 0) + 1;
      sectorHeldCount[p.sector] = (sectorHeldCount[p.sector] || 0) + 1;
    }
  });
  filled.forEach((s) => {
    const info = WATCHLIST[s.code];
    if (info) sectorCount[info.sector] = (sectorCount[info.sector] || 0) + 1;
  });
  Object.keys(sectorCount).forEach((sector) => {
    if (sectorCount[sector] >= 4) {
      const heldN = sectorHeldCount[sector] || 0;
      violations.push({
        level: "error",
        text: `セクター上限超過: 「${sector}」が${sectorCount[sector]}銘柄です${heldN > 0 ? `（保有中${heldN}件を含む）` : ""}。同一セクターは最大3銘柄（§2.2②）`,
      });
    }
  });

  // 3. 金融クラスタ上限（5枠以上で違反＝最大4銘柄。保有中を合算）
  const finHeldCount = held.filter((p) => p.sector && FINANCIAL_SECTORS.includes(p.sector)).length;
  const finFilledCount = filled.filter((s) => {
    const info = WATCHLIST[s.code];
    return info && FINANCIAL_SECTORS.includes(info.sector);
  }).length;
  const finCount = finHeldCount + finFilledCount;
  if (finCount >= 5) {
    violations.push({
      level: "error",
      text: `金融クラスタ上限超過: 銀行＋保険 合計${finCount}銘柄です${finHeldCount > 0 ? `（保有中${finHeldCount}件を含む）` : ""}。金融（銀行＋保険）は最大4銘柄（§2.2③）`,
    });
  }

  // 4. 非監視銘柄
  filled.forEach((s) => {
    if (!WATCHLIST[s.code]) {
      violations.push({
        level: "error",
        text: `枠${s.idx + 1}: コード${s.code}は監視リスト27銘柄外。フェニックス発注対象外`,
      });
    }
  });

  // 5. 黄区分（注意）
  filled.forEach((s) => {
    const info = WATCHLIST[s.code];
    if (info && info.cls === "yellow") {
      violations.push({
        level: "warn",
        text: `枠${s.idx + 1}: ${info.name}（${s.code}）は黄区分。緑で5枠が埋まらない時のみ使用`,
      });
    }
  });

  // 6. 成行禁止
  filled.forEach((s) => {
    if (NO_MARKET_CODES.includes(s.code)) {
      const info = WATCHLIST[s.code];
      violations.push({
        level: "error",
        text: `枠${s.idx + 1}: ${info.name}（${s.code}）は成行不可。前引け値の指値（当日限り）で発注、未約定なら見送り`,
      });
    }
  });

  return violations;
}

// SL = 前場安値 − max(0.3%×前引け値, ATR_used)。ATR_used = 手入力値 > 自動推定値 > 0
// （未入力・推定不能なら従来どおり0.3%のみ＝ATR_used=0で下限が採用される）。
function computePhoenixSlot(entry, morningLow, morningHigh, atrManual, code) {
  const RISK_CAP = 77000, NOTIONAL_CAP = 1027000, SL_PCT = 0.003, TP_MULT = 1.06, TRAIL_MULT = 1.015;
  const en = parseFloat(entry), ml = parseFloat(morningLow);
  if (!en || !ml || en <= 0 || ml <= 0) return null;

  const floorBuf = SL_PCT * en;
  const mh = parseFloat(morningHigh);
  const atrManualVal = parseFloat(atrManual);
  const hasManual = Number.isFinite(atrManualVal) && atrManualVal > 0;
  const est = hasManual ? null : estimateAtrYen(code, en, ml, mh);
  const atrCandidate = hasManual ? atrManualVal : (est ? est.value : 0);

  let buf, bufSource;
  if (atrCandidate >= floorBuf) {
    buf = atrCandidate;
    bufSource = hasManual
      ? { kind: "manual", label: "ATR入力値" }
      : { kind: "estimated", label: est.label };
  } else {
    buf = floorBuf;
    bufSource = { kind: "floor", label: "0.3%下限" };
  }

  const sl = ml - buf;
  const riskPerShare = en - sl;
  if (riskPerShare <= 0) return { error: "前引け値が前場安値以下です。入力を確認してください。" };
  const tp = en * TP_MULT, trailTrigger = en * TRAIL_MULT;
  const sharesByRisk = Math.floor(RISK_CAP / riskPerShare / 100) * 100;
  const sharesByNotional = Math.floor(NOTIONAL_CAP / en / 100) * 100;
  const finalShares = Math.min(sharesByRisk, sharesByNotional);
  if (finalShares <= 0) return { error: "建玉代金上限に対して株価が高すぎます（100株単位で購入不可）。見送り推奨。" };
  const binding = sharesByRisk <= sharesByNotional ? "risk" : "notional";
  return {
    sl, tp, trailTrigger, riskPerShare, sharesByRisk, sharesByNotional, finalShares, binding,
    buf, bufSource,
    positionValue: finalShares * en, maxLoss: finalShares * riskPerShare, maxGain: finalShares * (tp - en),
  };
}

function emptySlot() {
  return { code: "", entry: "", morningLow: "", morningHigh: "", atrManual: "", refPrice: "", fillPrice: "" };

function PhoenixCalc({ slots, setSlots, onRegister, heldPositions, closed }) {
  const updateSlot = (idx, field, value) => {
    setSlots((prev) => prev.map((s, i) => (i === idx ? { ...s, [field]: value } : s)));
  };
  const clearSlot = (idx) => {
    setSlots((prev) => prev.map((s, i) => (i === idx ? emptySlot() : s)));
  };
  const results = useMemo(
    () => slots.map((s) => computePhoenixSlot(s.entry, s.morningLow, s.morningHigh, s.atrManual, s.code)),
    [slots]
  );
  const violations = useMemo(() => computeViolations(slots, heldPositions), [slots, heldPositions]);
  const totalMaxLoss = useMemo(
    () => results.reduce((sum, r) => sum + ((r && !r.error) ? r.maxLoss : 0), 0),
    [results]
  );
  const overCap = totalMaxLoss > 154000;

  // 登録ボタン押下前のリアルタイム警告（保有中建玉・当日確定損益を加味。既存の computeRegistrationWarnings を流用）
  const slotWarnings = useMemo(() => slots.map((s, idx) => {
    const r = results[idx];
    if (!r || r.error) return [];
    const fillPrice = parseFloat(s.fillPrice);
    const entryPrice = fillPrice > 0 ? fillPrice : parseFloat(s.entry);
    return computeRegistrationWarnings({ code: s.code, qty: r.finalShares, entryPrice, slPrice: r.sl }, heldPositions, closed);
  }), [slots, results, heldPositions, closed]);

  const registerSlot = (idx) => {
    const s = slots[idx];
    const r = results[idx];
    if (!r || r.error) return;
    const fillPrice = parseFloat(s.fillPrice);
    const refPrice = parseFloat(s.refPrice);
    const morningClose = parseFloat(s.entry);
    const morningLow = parseFloat(s.morningLow);
    const entryPrice = fillPrice > 0 ? fillPrice : morningClose;
    const tpPrice = entryPrice * TP_MULT;
    onRegister({
      code: normalizeCode(s.code), qty: r.finalShares, entryPrice,
      slPrice: r.sl, tpPrice, entryDate: todayStr(),
      refPrice: refPrice > 0 ? refPrice : null,
      fillPrice: fillPrice > 0 ? fillPrice : null,
      morningClose: morningClose > 0 ? morningClose : null,
      morningLow: morningLow > 0 ? morningLow : null,
    });
    clearSlot(idx);
  };

  return e("div", { className: "space-y-4" },
    e(WatchlistPanel),
    e(ViolationPanel, { violations }),
    e("div", { className: "space-y-3" },
      slots.map((s, idx) => e(PhoenixSlotCard, {
        key: idx, idx, slot: s, result: results[idx], onChange: updateSlot,
        onRegister: () => registerSlot(idx), warnings: slotWarnings[idx],
      }))
    ),
    e(TotalLossCard, { totalMaxLoss, overCap })
  );
}

function AtypeCalc({ c2open, setC2open, c2high, setC2high }) {
  const RISK_CAP = 44000, NOTIONAL_CAP = 1000000;

  const r = useMemo(() => {
    const entry = parseFloat(c2open), spikeHigh = parseFloat(c2high);
    if (!entry || !spikeHigh || entry <= 0 || spikeHigh <= 0) return null;
    if (spikeHigh <= entry) return { error: "2本目高値が2本目始値以下です。入力を確認してください。" };
    const tick = tickSize(entry);
    const sl = Math.round((spikeHigh + tick) * 100) / 100;
    const riskPerShare = sl - entry;
    const tp = roundDownTick(entry * 0.97, tick);
    const sharesByRisk = Math.floor(RISK_CAP / riskPerShare / 100) * 100;
    const sharesByNotional = Math.floor(NOTIONAL_CAP / entry / 100) * 100;
    const finalShares = Math.min(sharesByRisk, sharesByNotional);
    if (finalShares <= 0) return { error: "建玉代金上限に対して株価が高すぎます（100株単位で売建不可）。見送り推奨。" };
    const binding = sharesByRisk <= sharesByNotional ? "risk" : "notional";
    return {
      tick, sl, tp, riskPerShare, sharesByRisk, sharesByNotional, finalShares, binding,
      positionValue: finalShares * entry, maxLoss: finalShares * riskPerShare, maxGain: finalShares * (entry - tp),
    };
  }, [c2open, c2high]);

  return e("div", { className: "space-y-5" },
    e("div", { className: "flex items-start gap-2 rounded-xl bg-slate-900/60 border border-slate-800 px-3.5 py-3 text-[12px] text-slate-400" },
      e(Info, { size: 14, className: "shrink-0 mt-0.5" }),

    ),
    e("div", { className: "grid grid-cols-1 gap-3" },
      e(NumberField, { id: "atype_c2open", label: "2本目の始値（＝エントリー価格）", value: c2open, onChange: setC2open, placeholder: "例: 1500", suffix: "円" }),
      e(NumberField, { id: "atype_c2high", label: "2本目の高値（スパイク高値）", value: c2high, onChange: setC2high, placeholder: "例: 1545", suffix: "円" })
    ),
    r && r.error && e("div", { className: "flex items-start gap-2 rounded-xl bg-red-500/10 border border-red-500/25 px-3.5 py-3 text-[13px] text-red-300" },
      e(AlertTriangle, { size: 16, className: "shrink-0 mt-0.5" }),
      e("span", null, r.error)
    ),
    r && !r.error && e(React.Fragment, null,

function effectivePositionMaxLoss(p) {
  const hasSl = Number.isFinite(p.slPrice);
  if (!hasSl && !p.trailArmed) return 0;
  const eff = p.trailArmed ? Math.max(hasSl ? p.slPrice : p.entryPrice, p.entryPrice) : p.slPrice;
  return Math.max(0, (p.entryPrice - eff) * p.qty);
}

function todayRealizedPnl(closed) {
  const today = todayStr();
  return closed.filter((c) => c.closeDate === today).reduce((sum, c) => sum + c.pnl, 0);
}

  const totalMaxLoss = positions.reduce((sum, p) => sum + effectivePositionMaxLoss(p), 0);
  const todayPnlSum = todayRealizedPnl(closed);
  const todayLoss = Math.max(0, -todayPnlSum);
  const overDaily = todayLoss + totalMaxLoss > DAILY_LOSS_CAP;

  // rulebook v1.9: 今夜OCO取消・本日寄成返済の建玉件数

function computeRegistrationWarnings(form, positions, closed) {
  const code = normalizeCode(form.code);
  const qty = parseFloat(form.qty);
  const entryPrice = parseFloat(form.entryPrice);
  const slPrice = parseFloat(form.slPrice);
  if (!(code.length === 4 && qty > 0 && entryPrice > 0)) return [];

  const warnings = [];
  const info = WATCHLIST[code];
  const positionValue = qty * entryPrice;

  if (positionValue > NOTIONAL_CAP) {
    warnings.push(`建玉代金 ¥${fmt(positionValue)} が1銘柄上限 ¥${fmt(NOTIONAL_CAP)} を超えています`);
  }
  if (Number.isFinite(slPrice) && slPrice < entryPrice) {
    const risk = (entryPrice - slPrice) * qty;
    if (risk > RISK_CAP) {
      warnings.push(`1建玉のリスク ¥${fmt(risk)} が上限 ¥${fmt(RISK_CAP)} を超えています`);
    }
  }
  const heldCodes = positions.map((p) => normalizeCode(p.code));
  if (heldCodes.includes(code)) {
    warnings.push(`重複: ${code}${info ? "（" + info.name + "）" : ""}は保有中の建玉と重複しています`);
  }
  const postCount = positions.length + 1;
  if (postCount > MAX_POSITIONS) {
    warnings.push(`登録後の保有数が${postCount}件になり、同時保有上限${MAX_POSITIONS}件を超えます`);
  }

  const existingMaxLossSum = positions.reduce((sum, p) => sum + effectivePositionMaxLoss(p), 0);
  const newMaxLoss = Number.isFinite(slPrice) && slPrice < entryPrice ? (entryPrice - slPrice) * qty : 0;
  const todayLoss = Math.max(0, -todayRealizedPnl(closed));
  const projectedTotal = existingMaxLossSum + newMaxLoss + todayLoss;
  if (projectedTotal > DAILY_LOSS_CAP) {
    warnings.push(`登録後の想定最大損失合計＋当日確定損失 ¥${fmt(projectedTotal)} が日次上限 ¥${fmt(DAILY_LOSS_CAP)} を超えます`);
  }

  if (info) {
    const sectorAfter = positions.filter((p) => p.sector === info.sector).length + 1;
    if (sectorAfter >= 4) {
      warnings.push(`登録後「${info.sector}」セクターが${sectorAfter}銘柄になります（同一セクター上限3）`);
    }
    if (FINANCIAL_SECTORS.includes(info.sector)) {
      const finAfter = positions.filter((p) => p.sector && FINANCIAL_SECTORS.includes(p.sector)).length + 1;
      if (finAfter >= 5) {
        warnings.push(`登録後 金融（銀行＋保険）が${finAfter}銘柄になります（金融クラスタ上限4）`);
      }
    }
    if (info.cls === "yellow") {
      warnings.push(`${info.name}（${code}）は黄区分。緑で5枠が埋まらない時のみ使用`);
    }
    if (NO_MARKET_CODES.includes(code)) {
      warnings.push(`${info.name}（${code}）は成行不可。前引け値の指値（当日限り）で発注、未約定なら見送り`);
    }
  } else {
    warnings.push(`コード${code}は監視リスト27銘柄外。フェニックス発注対象外`);
  }

  return warnings;
}

function RegistrationWarnings({ warnings }) {
  if (!warnings || warnings.length === 0) return null;
  return e("div", { className: "space-y-1.5" },
    warnings.map((w, i) => e("div", {

    ))

}

// ---- CSVバックアップ（建玉・決済履歴のみ。sizing_v1は対象外。最小限のRFC4180準拠） ----
const CSV_HEADER = [
  "type", "id", "code", "name", "sector", "entryDate", "qty", "entryPrice", "slPrice", "tpPrice",
  "trailArmed", "refPrice", "fillPrice", "morningClose", "morningLow", "closeDate", "closePrice", "pnl", "note",
];

function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function numOrEmpty(v) { return Number.isFinite(v) ? String(v) : ""; }

function positionToCsvRow(p) {
  return [
    "position", p.id, p.code, p.name, p.sector || "", p.entryDate, numOrEmpty(p.qty), numOrEmpty(p.entryPrice),
    numOrEmpty(p.slPrice), numOrEmpty(p.tpPrice), p.trailArmed ? "true" : "false",
    numOrEmpty(p.refPrice), numOrEmpty(p.fillPrice), numOrEmpty(p.morningClose), numOrEmpty(p.morningLow),
    "", "", "", p.note || "",
  ].map(csvEscape).join(",");
}
function closedToCsvRow(c) {
  return [
    "closed", c.id, c.code, c.name, c.sector || "", c.entryDate, numOrEmpty(c.qty), numOrEmpty(c.entryPrice),
    "", "", "",
    numOrEmpty(c.refPrice), numOrEmpty(c.fillPrice), numOrEmpty(c.morningClose), numOrEmpty(c.morningLow),
    c.closeDate, numOrEmpty(c.closePrice), numOrEmpty(c.pnl), c.note || "",
  ].map(csvEscape).join(",");
}
function buildCsv(positions, closed) {
  const lines = [CSV_HEADER.join(",")];
  positions.forEach((p) => lines.push(positionToCsvRow(p)));
  closed.forEach((c) => lines.push(closedToCsvRow(c)));
  return lines.join("\r\n");
}

// 自前の最小CSVパーサ（引用符・エスケープ・改行対応）。1行=1配列で返す
function parseCsvRows(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
      } else {
        field += c;
      }
      continue;
    }
    if (c === '"') { inQuotes = true; continue; }
    if (c === ',') { row.push(field); field = ""; continue; }
    if (c === '\r') { continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; continue; }
    field += c;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter((r) => !(r.length === 1 && r[0] === ""));
}

// 先頭のUTF-8 BOM（U+FEFF）を除去する。ファイルダウンロード分・コピペ経由の混入分の両方に対応
function stripBom(text) {
  return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
}

function parseBackupCsv(text) {
  const rows = parseCsvRows(text);
  if (rows.length === 0) throw new Error("データがありません。");
  const header = rows[0];
  if (header[0] !== "type" || header.length !== CSV_HEADER.length) {
    throw new Error(`ヘッダ形式が不正です（1行目が type から始まる${CSV_HEADER.length}列のCSVである必要があります）。旧JSON形式のバックアップはインポートできません。`);
  }
  const numOrNull = (s) => {
    if (s === "" || s === undefined) return null;
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : null;
  };
  const positions = [];
  const closed = [];
  for (let i = 1; i < rows.length; i++) {
    const cols = rows[i];
    if (cols.length !== CSV_HEADER.length) {
      throw new Error(`${i + 1}行目: 列数が${CSV_HEADER.length}列ではありません（${cols.length}列）。`);
    }
    const [type, id, code, name, sector, entryDate, qtyS, entryPriceS, slPriceS, tpPriceS, trailArmedS,
      refPriceS, fillPriceS, morningCloseS, morningLowS, closeDate, closePriceS, pnlS, note] = cols;
    const qty = parseFloat(qtyS), entryPrice = parseFloat(entryPriceS);
    if (!code || !Number.isFinite(qty) || !Number.isFinite(entryPrice)) {
      throw new Error(`${i + 1}行目: code・qty・entryPrice が不正です。`);
    }
    const base = {
      id: id || genId(), code, name: name || code, sector: sector || null,
      entryDate, qty, entryPrice,
      refPrice: numOrNull(refPriceS), fillPrice: numOrNull(fillPriceS),
      morningClose: numOrNull(morningCloseS), morningLow: numOrNull(morningLowS),
      note: note || "",
    };
    if (type === "position") {
      positions.push({
        ...base,
        slPrice: numOrNull(slPriceS), tpPrice: numOrNull(tpPriceS),
        trailArmed: trailArmedS === "true",
      });
    } else if (type === "closed") {
      const closePrice = parseFloat(closePriceS), pnl = parseFloat(pnlS);
      if (!closeDate || !Number.isFinite(closePrice) || !Number.isFinite(pnl)) {
        throw new Error(`${i + 1}行目: closed行の closeDate・closePrice・pnl が不正です。`);
      }
      closed.push({ ...base, closeDate, closePrice, pnl });
    } else {
      throw new Error(`${i + 1}行目: type列が position/closed のいずれでもありません（${type}）。`);
    }
  }
  return { positions, closed };
}

function BackupPanel({ positions, setPositions, closed, setClosed }) {
  const [open, setOpen] = useState(false);
  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  const doExport = () => {
    setExportText(buildCsv(positions, closed));
  };

  const doDownloadCsv = () => {
    const csv = buildCsv(positions, closed);
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `kentama_backup_${todayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // CSVテキストを解析→確認→反映する共通フロー（テキストエリア版・ファイル版で共用）
  const applyImportedCsv = (rawText) => {
    setImportError("");
    const text = stripBom(rawText);
    let result;
    try {
      result = parseBackupCsv(text);
    } catch (err) {
      setImportError(err.message || "CSVの解析に失敗しました。貼り付け内容を確認してください。");
      return false;
    }
    if (!window.confirm("現在のデータを上書きします。よろしいですか？")) return false;
    lsSet("positions_v1", result.positions);
    lsSet("closed_v1", result.closed);
    setPositions(result.positions);
    setClosed(result.closed);
    setImportError("");
    return true;
  };

  const doImport = () => {
    if (applyImportedCsv(importText)) setImportText("");
  };

  const doFileImportClick = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleFileChange = (ev) => {
    const inputEl = ev.target;
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      applyImportedCsv(String(reader.result || ""));
    };
    reader.onloadend = () => {
      inputEl.value = "";
    };
    reader.readAsText(file);
  };

  return e("div", { className: "rounded-xl bg-slate-900/60 border border-slate-800" },
    e("button", {
      onClick: () => setOpen((o) => !o),
      className: "w-full flex items-center justify-between px-3.5 py-2.5 text-[12.5px] font-medium text-slate-300",
    }, e("span", null, `バックアップ ${open ? "▲" : "▼"}`)),
    open && e("div", { className: "px-3.5 pb-3.5 space-y-3" },
      e("div", { className: "text-[11px] text-slate-500" }, "CSV形式（建玉・決済履歴のみ。サイジング入力は対象外）。旧JSON形式のバックアップは読み込めません"),
      e("div", { className: "space-y-1.5" },
        e("div", { className: "text-[11.5px] text-slate-500" }, "エクスポート"),
        e("div", { className: "flex gap-2" },
          e("button", {
            onClick: doExport,
            className: "flex-1 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-[12.5px] font-semibold py-2.5",
          }, "エクスポート"),
          e("button", {
            onClick: doDownloadCsv,
            className: "flex-1 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-[12.5px] font-semibold py-2.5",
          }, "CSVファイルをダウンロード")
        ),
        exportText && e("textarea", {
          readOnly: true,
          value: exportText,
          onClick: (ev) => ev.target.select(),
          rows: 6,
          className: "w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-[11px] font-mono text-slate-300",
        })
      ),
      e("div", { className: "space-y-1.5" },
        e("div", { className: "text-[11.5px] text-slate-500" }, "インポート（現在のデータを上書き）"),
        e("textarea", {
          value: importText,
          onChange: (ev) => setImportText(ev.target.value),
          placeholder: "エクスポートしたCSVをここに貼り付け",
          rows: 6,
          className: "w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-[11px] font-mono text-slate-300 placeholder:text-slate-600",
        }),
        importError && e("div", { className: "text-[12px] text-red-400" }, importError),
        e("div", { className: "flex gap-2" },
          e("button", {
            onClick: doImport,
            className: "flex-1 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[12.5px] font-semibold py-2.5",
          }, "インポート"),
          e("button", {
            onClick: doFileImportClick,
            className: "flex-1 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[12.5px] font-semibold py-2.5",
          }, "CSVファイルを選択してインポート")
        ),
        e("input", {
          ref: fileInputRef,
          type: "file",
          accept: ".csv,text/csv,text/plain",
          onChange: handleFileChange,
          className: "hidden",
        })
      )
    )
  );
}

function PositionsSection({ positions, setPositions, closed, setClosed }) {
  const [formOpen, setFormOpen] = useState(false);
  const [form, setForm] = useState({ ...DEFAULT_POSITION_FORM, entryDate: todayStr() });
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [settlingId, setSettlingId] = useState(null);
  const [settlePrice, setSettlePrice] = useState("");
  const [closedOpen, setClosedOpen] = useState(false);

  const updateForm = (field, value) => setForm((prev) => ({ ...prev, [field]: value }));

  const canRegister = normalizeCode(form.code).length === 4 &&
    parseFloat(form.qty) > 0 && parseFloat(form.entryPrice) > 0;

  const registerPosition = () => {
    if (!canRegister) return;
    const newPos = buildPosition({
      code: form.code,
      qty: parseFloat(form.qty), entryPrice: parseFloat(form.entryPrice),
      slPrice: parseFloat(form.slPrice), tpPrice: parseFloat(form.tpPrice),
      entryDate: form.entryDate || todayStr(), note: form.note,
      refPrice: parseFloat(form.refPrice), fillPrice: parseFloat(form.fillPrice),
      morningClose: parseFloat(form.morningClose), morningLow: parseFloat(form.morningLow),
    });
    setPositions((prev) => [...prev, newPos]);
    setForm({ ...DEFAULT_POSITION_FORM, entryDate: todayStr() });
    setFormOpen(false);
  };

  const toggleTrail = (id) => {
    setPositions((prev) => prev.map((p) => (p.id === id ? { ...p, trailArmed: !p.trailArmed } : p)));
  };

  const startEdit = (pos) => {
    setEditingId(pos.id);
    setEditForm({
      qty: String(pos.qty), entryPrice: String(pos.entryPrice),
      slPrice: Number.isFinite(pos.slPrice) ? String(pos.slPrice) : "",
      tpPrice: Number.isFinite(pos.tpPrice) ? String(pos.tpPrice) : "",
      entryDate: pos.entryDate, note: pos.note || "",
      refPrice: Number.isFinite(pos.refPrice) ? String(pos.refPrice) : "",
      fillPrice: Number.isFinite(pos.fillPrice) ? String(pos.fillPrice) : "",
      morningClose: Number.isFinite(pos.morningClose) ? String(pos.morningClose) : "",
      morningLow: Number.isFinite(pos.morningLow) ? String(pos.morningLow) : "",
    });
  };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); };
  const saveEdit = () => {
    setPositions((prev) => prev.map((p) => {
      if (p.id !== editingId) return p;
      const qty = parseFloat(editForm.qty), entryPrice = parseFloat(editForm.entryPrice);
      const slPrice = parseFloat(editForm.slPrice), tpPrice = parseFloat(editForm.tpPrice);
      const refPrice = parseFloat(editForm.refPrice), fillPrice = parseFloat(editForm.fillPrice);
      const morningClose = parseFloat(editForm.morningClose), morningLow = parseFloat(editForm.morningLow);
      return {
        ...p,
        qty: qty > 0 ? qty : p.qty,
        entryPrice: entryPrice > 0 ? entryPrice : p.entryPrice,
        slPrice: Number.isFinite(slPrice) ? slPrice : null,
        tpPrice: Number.isFinite(tpPrice) ? tpPrice : null,
        entryDate: editForm.entryDate || p.entryDate,
        note: (editForm.note || "").trim(),
        refPrice: Number.isFinite(refPrice) ? refPrice : null,
        fillPrice: Number.isFinite(fillPrice) ? fillPrice : null,
        morningClose: Number.isFinite(morningClose) ? morningClose : null,
        morningLow: Number.isFinite(morningLow) ? morningLow : null,
      };
    }));
    setEditingId(null);
    setEditForm(null);
  };

  const startSettle = (pos) => { setSettlingId(pos.id); setSettlePrice(""); };
  const cancelSettle = () => { setSettlingId(null); setSettlePrice(""); };
  const confirmSettle = () => {
    const closePrice = parseFloat(settlePrice);
    if (!(closePrice > 0)) return;
    const pos = positions.find((p) => p.id === settlingId);
    if (!pos) return;
    const pnl = (closePrice - pos.entryPrice) * pos.qty;
    const record = {
      id: genId(), code: pos.code, name: pos.name, sector: pos.sector,
      entryDate: pos.entryDate, closeDate: todayStr(), qty: pos.qty,
      entryPrice: pos.entryPrice, closePrice, pnl, note: pos.note || "",
      refPrice: Number.isFinite(pos.refPrice) ? pos.refPrice : null,
      fillPrice: Number.isFinite(pos.fillPrice) ? pos.fillPrice : null,
      morningClose: Number.isFinite(pos.morningClose) ? pos.morningClose : null,
      morningLow: Number.isFinite(pos.morningLow) ? pos.morningLow : null,
    };
    setClosed((prev) => [...prev, record]);
    setPositions((prev) => prev.filter((p) => p.id !== pos.id));
    setSettlingId(null);
    setSettlePrice("");
  };

  const warnings = useMemo(() => computeRegistrationWarnings(form, positions, closed), [form, positions, closed]);

  return e("div", { className: "space-y-4" },
    e("div", { className: "rounded-xl bg-slate-900/60 border border-slate-800" },
      e("button", {
        onClick: () => setFormOpen((o) => !o),
        className: "w-full flex items-center justify-between px-3.5 py-3 text-[13px] font-medium text-slate-300",
      }, e("span", null, `建玉を登録 ${formOpen ? "▲" : "▼"}`)),
      formOpen && e("div", { className: "px-3.5 pb-3.5 space-y-2.5" },
        e(CodeField, { value: form.code, onChange: (v) => updateForm("code", v) }),
        e(StockBadge, { code: form.code }),
        e(PositionEditFields, { form, onChange: updateForm }),
        e(RegistrationWarnings, { warnings }),
        e("button", {
          onClick: registerPosition,
          disabled: !canRegister,
          className: `w-full rounded-lg text-[13.5px] font-semibold py-3 ${canRegister ? "bg-emerald-500/90 text-slate-950" : "bg-slate-800 text-slate-600"}`,
        }, "登録")
      )
    ),
    e(SummaryPanel, { positions, closed }),
    positions.length === 0
      ? e("div", { className: "rounded-xl bg-slate-900/40 border border-slate-800 px-3.5 py-6 text-center text-[13px] text-slate-500" }, "建玉はまだありません")
      : e("div", { className: "space-y-3" },
          positions.map((pos) => e(PositionCard, {
            key: pos.id, pos,
            isEditing: editingId === pos.id, editForm,
            onEditField: (field, v) => setEditForm((prev) => ({ ...prev, [field]: v })),
            onStartEdit: () => startEdit(pos),
            onCancelEdit: cancelEdit,
            onSaveEdit: saveEdit,
            onToggleTrail: () => toggleTrail(pos.id),
            isSettling: settlingId === pos.id,
            settlePrice,
            onSettlePriceChange: setSettlePrice,
            onStartSettle: () => startSettle(pos),
            onCancelSettle: cancelSettle,
            onConfirmSettle: confirmSettle,
          }))
        ),
    e(ClosedHistoryPanel, { closed, open: closedOpen, onToggle: () => setClosedOpen((o) => !o) }),
    e(BackupPanel, { positions, setPositions, closed, setClosed })
  );
}

const DEFAULT_SIZING = {
  slots: [0, 1, 2, 3, 4].map(() => emptySlot()),
  c2open: "",
  c2high: "",
};

// 旧スキーマ（refPrice/fillPrice・morningHigh/atrManual無し）の sizing_v1 を
// 読み込んでも壊れないよう正規化
function normalizeSizing(raw) {
  const base = raw && typeof raw === "object" ? raw : {};
  const rawSlots = Array.isArray(base.slots) ? base.slots : [];
  const slots = [0, 1, 2, 3, 4].map((i) => {
    const s = rawSlots[i] || {};
    return {
      code: s.code || "", entry: s.entry || "", morningLow: s.morningLow || "",
      morningHigh: s.morningHigh || "", atrManual: s.atrManual || "",
      refPrice: s.refPrice || "", fillPrice: s.fillPrice || "",
    };
  });
  return { slots, c2open: base.c2open || "", c2high: base.c2high || "" };
}

function SizingSection({ onRegister, heldPositions, closed }) {
  const [tab, setTab] = useState("phoenix");
  const [sizing, setSizing] = useState(() => normalizeSizing(lsGet("sizing_v1", DEFAULT_SIZING)));
  useEffect(() => { lsSet("sizing_v1", sizing); }, [sizing]);

  const setSlots = (updater) => {
    setSizing((prev) => ({
      ...prev,
      slots: typeof updater === "function" ? updater(prev.slots) : updater,
    }));
  };
  const setC2open = (v) => setSizing((prev) => ({ ...prev, c2open: v }));
  const setC2high = (v) => setSizing((prev) => ({ ...prev, c2high: v }));

  const clearSizing = () => {
    if (!window.confirm("サイジング入力をすべてクリアしますか？")) return;
    setSizing(DEFAULT_SIZING);
  };

  return e("div", null,
    e("div", { className: "grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-900 border border-slate-800 mb-5" },
      e("button", {
        onClick: () => setTab("phoenix"),
        className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${tab === "phoenix" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
      }, e(TrendingUp, { size: 15 }), "フェニックス"),
      e("button", {
        onClick: () => setTab("atype"),
        className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${tab === "atype" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
      }, e(TrendingDown, { size: 15 }), "A型")
    ),
    tab === "phoenix"
      ? e(PhoenixCalc, { slots: sizing.slots, setSlots, onRegister, heldPositions, closed })
      : e(AtypeCalc, { c2open: sizing.c2open, setC2open, c2high: sizing.c2high, setC2high }),
    e("div", { className: "mt-6 flex items-start gap-2 rounded-xl bg-slate-900/50 border border-slate-800 px-3.5 py-3 text-[12px] text-slate-500" },
      e(Info, { size: 14, className: "shrink-0 mt-0.5" }),
      e("span", null, "フェニックス同時保有最大5枠（セクター上限3・金融上限4）・1日損失上限15.4万円／A型1日1件・上限8.8万円／合算24.2万円で当日全システム停止。")
    ),
    e("button", {
      onClick: clearSizing,
      className: "mt-4 w-full rounded-xl border border-slate-800 bg-slate-900/60 py-2.5 text-[12.5px] font-medium text-slate-400 hover:text-red-300 hover:border-red-500/30 transition-colors",
    }, "入力をクリア")
  );
}

function NoticeBanner({ notice, onDone }) {
  useEffect(() => {
    if (!notice) return undefined;
    const t = setTimeout(onDone, 4000);
    return () => clearTimeout(t);
  }, [notice]);
  if (!notice) return null;
  return e("div", {
    className: "mb-4 flex items-center gap-2 rounded-xl bg-emerald-500/10 border border-emerald-500/25 px-3.5 py-3 text-[13px] text-emerald-300",
  },
    e(Info, { size: 16, className: "shrink-0" }),
    e("span", null, notice.text)
  );
}

function App() {
  const [topTab, setTopTab] = useState("sizing");
  const [positions, setPositions] = usePersistentState("positions_v1", []);
  const [closed, setClosed] = usePersistentState("closed_v1", []);
  const [notice, setNotice] = useState(null);

  const handleRegister = (fields) => {
    const pos = buildPosition(fields);
    setPositions((prev) => [...prev, pos]);
    setNotice({ text: `${pos.name}（${pos.code}）を登録しました`, key: genId() });
    setTopTab("positions");
  };

  return e("div", {
    className: "min-h-screen bg-slate-950 text-slate-100 flex justify-center",
    style: { paddingTop: "env(safe-area-inset-top)", paddingBottom: "env(safe-area-inset-bottom)" },
  },
    e("div", { className: "w-full max-w-md px-4 pt-6 pb-10" },
      e("div", { className: "mb-5" },
        e("h1", { className: "text-[20px] font-bold tracking-tight text-slate-50" }, "ポジションサイジング"),
        e("p", { className: "text-[12px] text-slate-500 mt-0.5" }, "リスク上限 ÷ SL距離 と 建玉代金上限 の小さい方を採用")
      ),
      e("div", { className: "grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-900 border border-slate-800 mb-5" },
        e("button", {
          onClick: () => setTopTab("sizing"),
          className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${topTab === "sizing" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
        }, "サイジング"),
        e("button", {
          onClick: () => setTopTab("positions"),
          className: `flex items-center justify-center gap-1.5 py-2.5 rounded-lg text-[14px] font-medium transition-colors ${topTab === "positions" ? "bg-slate-100 text-slate-900" : "text-slate-400"}`,
        }, "建玉管理")
      ),
      topTab === "positions" && e(NoticeBanner, { notice, onDone: () => setNotice(null) }),
      // 両タブを常時マウントしCSSで表示切替（登録直後の枠クリアがタブ切替と同一バッチで
      // 走るため、SizingSectionをアンマウントすると setSlots によるクリアが
      // localStorageへ反映される前に消える。tab切替のたびに再マウントしないことで回避）
      e("div", { className: topTab === "sizing" ? "" : "hidden" },
        e(SizingSection, { onRegister: handleRegister, heldPositions: positions, closed })),
      e("div", { className: topTab === "positions" ? "" : "hidden" },
        e(PositionsSection, { positions, setPositions, closed, setClosed }))
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
